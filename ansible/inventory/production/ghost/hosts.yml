---
# ──────────────────────────────────────────────────────────
# Ghost deployment host definition
# ──────────────────────────────────────────────────────────
all:
  children:
    ghost:
      hosts:
        ghost.example.com:
          ansible_host: 100.125.8.125
          ansible_user: root
      vars:
        # ── Site identity ────────────────────────────────
        client_name: ghost
        domain: ghost.local
        tailnet_ip: 100.125.8.125

        # ── Grist ────────────────────────────────────────
        grist_port: 8484
        grist_image: gristlabs/grist:latest
        grist_data_dir: /var/lib/grist
        grist_env:
          APP_HOME_URL: "http://ghost.local:8484"
          GRIST_SINGLE_ORG: "docs"

        # ── Dockhand ─────────────────────────────────────
        dockhand_port: 3000
        dockhand_image: fnsys/dockhand:latest
        dockhand_data_dir: /app/data
        dockhand_volume: dockhand_data
        dockhand_env:
          PORT: "3000"
          HOST: "0.0.0.0"
          DATA_DIR: "/app/data"
          PUID: "1001"
          PGID: "1001"
