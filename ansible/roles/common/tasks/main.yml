---
# ──────────────────────────────────────────────────────────
# common/tasks/main.yml — baseline setup
# ──────────────────────────────────────────────────────────

- name: Ensure common system packages are present
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  when: common_packages is defined

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/grist
    - /opt/dockhand
  when: inventory_hostname in groups['ghost']
